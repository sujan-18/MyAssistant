[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "myassistant"
version = "0.1.0"
description = "A local-first Windows desktop productivity assistant."
readme = "README.md"
requires-python = ">=3.14.8,<3.15"
dependencies = ["PySide6==6.11.2", "tzdata==2026.4"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
voice = [
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "pywin32==312; platform_system == 'Windows'",
    "sounddevice==0.5.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.setuptools]
py-modules = ["main", "config"]
packages = ["core", "launcher", "search", "system", "todo", "ui", "voice"]
